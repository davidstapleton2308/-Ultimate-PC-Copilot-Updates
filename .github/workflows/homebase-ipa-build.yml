name: Homebase iOS and Windows Companion
on:
  push:
    branches:
      - homebase-ipa-build
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Homebase
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec homebase-project.yml
          xcodebuild -project Homebase.xcodeproj -scheme Homebase \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HomebaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p "$RUNNER_TEMP/pack/Payload" dist
          cp -R "$RUNNER_TEMP/HomebaseDerivedData/Build/Products/Release-iphoneos/Homebase.app" "$RUNNER_TEMP/pack/Payload/"
          test -f "$RUNNER_TEMP/pack/Payload/Homebase.app/Homebase"
          cd "$RUNNER_TEMP/pack"
          zip -qr "$GITHUB_WORKSPACE/dist/Homebase-unsigned.ipa" Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Homebase-iOS-IPA
          path: dist/Homebase-unsigned.ipa
          retention-days: 30

  windows-companion:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller cryptography psutil "qrcode[pil]" pillow
      - name: Validate source
        shell: pwsh
        run: python -m py_compile windows/HomebaseCompanion.py
      - name: Package Homebase Companion
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name HomebaseCompanion --collect-all cryptography windows/HomebaseCompanion.py
          if (!(Test-Path "dist/HomebaseCompanion.exe")) { throw "Missing executable" }
      - name: Upload Windows Companion
        uses: actions/upload-artifact@v4
        with:
          name: Homebase-Windows-Companion
          path: dist/HomebaseCompanion.exe
          retention-days: 30
