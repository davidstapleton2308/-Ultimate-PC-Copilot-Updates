name: Homebase
options:
  bundleIdPrefix: com.homebase.personal
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  Homebase:
    type: application
    platform: iOS
    sources: [Homebase]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homebase.personal.app
        INFOPLIST_KEY_CFBundleDisplayName: Homebase
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the QR code displayed by Homebase Companion on your Windows laptop.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect securely to your paired Windows laptop over your local Wi-Fi.
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 2
        CODE_SIGNING_ALLOWED: NO
